name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Test core
        run: cargo test --release --manifest-path core/Cargo.toml
      - name: Build and package
        run: make release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/MD-QuickLook-*.zip \
            --title "MD QuickLook ${GITHUB_REF_NAME#v}" --generate-notes
